<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject or "Email" }}</title>
</head>

<body
    style="margin:0;padding:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#333333;">

    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f5;padding:40px 0;">
        <tr>
            <td align="center">

                <table role="presentation" width="600" cellspacing="0" cellpadding="0"
                    style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">

                    <tr>
                        <td style="padding:32px 40px;background:#111827;color:#ffffff;">
                            <h1 style="margin:0;font-size:24px;font-weight:600;">
                                FastAPI Auth
                            </h1>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:40px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:24px 40px;background:#f9fafb;color:#6b7280;font-size:13px;line-height:20px;">
                            This email was sent automatically. Please do not reply to this message.
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>

</html>
